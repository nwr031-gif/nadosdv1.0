version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  detailed:
    format: "%(asctime)s | %(levelname)-8s | %(name)s:%(lineno)d | %(funcName)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  json:
    format: '{"timestamp": "%(asctime)s", "level": "%(levelname)s", "logger": "%(name)s", "line": %(lineno)d, "function": "%(funcName)s", "message": "%(message)s"}'
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: "logs/nados.log"
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8
  
  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: "logs/nados_errors.log"
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8

  json_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json
    filename: "logs/nados_structured.log"
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8

loggers:
  nados:
    level: DEBUG
    handlers: [console, file, error_file, json_file]
    propagate: false
  
  nados.simulation:
    level: DEBUG
    handlers: [console, file, error_file, json_file]
    propagate: false
  
  nados.tracking:
    level: DEBUG
    handlers: [console, file, error_file, json_file]
    propagate: false
  
  nados.ui:
    level: INFO
    handlers: [console, file, error_file]
    propagate: false

root:
  level: INFO
  handlers: [console, file, error_file]