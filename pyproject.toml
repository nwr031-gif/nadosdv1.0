[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nados-dv1"
version = "1.0.0"
description = "NADOS Dv1.0 - Integrated Air Defense Research & Simulation Environment"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "NADOS Development Team", email = "nados@example.com"}
]
keywords = ["simulation", "research", "air-defense", "sensor-tracking", "kalman-filter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.6.0",
    "numpy>=1.26.0",
    "pydantic>=2.5.0",
    "PyYAML>=6.0.1",
    "sqlalchemy>=2.0.0",
    "matplotlib>=3.8.0",
    "pandas>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.2.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "black>=23.0.0",
]
viz3d = [
    "panda3d>=1.10.13",
]

[project.scripts]
nados = "nados.main:main"
nados-app = "scripts.run_app:main"
nados-test = "scripts.run_tests:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nados*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]
ignore = [
    "N806",  # matrix notation F, H, Q, R is intentional in tracking code
    "UP042",  # (str, Enum) is intentional for pydantic serialization
    "B904",   # exception chaining style not enforced
    "SIM117",  # nested try/with acceptable in optional-import code
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201", "E402"]  # CLI scripts print and manipulate sys.path
"src/nados/scripts/*" = ["T201"]
"src/nados/visualization/view3d.py" = ["F401"]  # optional Panda3D availability imports
"src/nados/ui/*" = ["N802", "N803"]  # Qt event-handler overrides (closeEvent, paintEvent)
"web/backend/main.py" = ["E402"]  # sys.path setup before app imports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=nados --cov-report=term-missing --cov-report=xml"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["nados"]
omit = [
    "*/tests/*",
    "*/scripts/*",
    # GUI and 3D rendering layers are exercised manually / by UI tests with a
    # display server; they are excluded from headless CI coverage measurement.
    "src/nados/ui/*",
    "src/nados/visualization/*",
    "src/nados/plugins/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]