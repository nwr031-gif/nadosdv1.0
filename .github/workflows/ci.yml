# NADOS Dv1.0 CI Configuration

name: NADOS Dv1.0 CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  # Qt runs the plugin import in headless CI; use the offscreen platform.
  QT_QPA_PLATFORM: offscreen

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff (linting)
        run: ruff check .

      - name: Run Ruff (formatting check)
        run: ruff format --check .

      - name: Run MyPy (type checking)
        run: mypy src/nados --ignore-missing-imports || true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Qt runtime libraries (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Initialize database
        run: python -m nados.scripts.init_db

      - name: Run unit tests with coverage
        run: |
          python -m pytest tests/unit/ --cov=nados --cov-report=xml --cov-report=term --cov-fail-under=85

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Qt runtime libraries (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Initialize database
        run: python -m nados.scripts.init_db

      - name: Validate demo scenarios
        run: python scripts/validate_scenarios.py

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ -v --tb=short

  regression-tests:
    name: Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Qt runtime libraries (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Initialize database
        run: python -m nados.scripts.init_db

      - name: Run regression tests
        run: |
          python -m pytest tests/regression/ -v --tb=short

  package-test:
    name: Package Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Test package installation
        run: |
          pip install dist/*.whl
          python -c "import nados; print('Package imports OK')"

      - name: Test entry points
        run: |
          nados --help || true
          nados-app --help || true
          nados-test --help || true

  web-frontend:
    name: Web Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: web/frontend
        run: npm ci

      - name: Build frontend
        working-directory: web/frontend
        run: npm run build

  notify:
    name: Notify on Failure
    needs: [lint-and-typecheck, unit-tests, integration-tests, regression-tests, package-test, web-frontend]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        run: |
          echo "CI pipeline failed. Check GitHub Actions for details."

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
